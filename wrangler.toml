# Cloudflare Workers + D1 + static assets (web UI)
name = "cointrace"
main = "packages/api/dist/worker.js"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "cointrace"
database_id = "72198afb-c475-4b32-a0fc-53fa34614a97"
migrations_dir = "migrations"

[triggers]
crons = ["*/1 * * * *"]

[vars]
# Local `pnpm cf:dev` / top-level config — no per-IP API rate limits.
ENVIRONMENT = "development"
ESPLORA_BASE = "https://blockstream.info/api"
MEMPOOL_BASE = "https://mempool.space/api"
# Set CORS_ORIGINS to your Worker URL(s), comma-separated (required for browser CORS).
CORS_ORIGINS = "http://localhost:8787,http://127.0.0.1:8787"
RATE_LIMIT_MS = "8000"
JOBS_PER_TICK = "7"
TICK_BUDGET_MS = "50000"
RUNNING_JOB_STALE_MS = "120000"
MAX_GRAPH_VICTIMS = "10000"
MAX_GRAPH_DOWNSTREAM = "10000"

# Production deploy: `pnpm cf:deploy` → wrangler deploy --env production
# Worker name: cointrace-production. Bindings (vars/D1/assets) are non-inheritable.
[env.production.assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[env.production.d1_databases]]
binding = "DB"
database_name = "cointrace"
database_id = "72198afb-c475-4b32-a0fc-53fa34614a97"
migrations_dir = "migrations"

[env.production.triggers]
crons = ["*/1 * * * *"]

[env.production.vars]
ENVIRONMENT = "production"
ESPLORA_BASE = "https://blockstream.info/api"
MEMPOOL_BASE = "https://mempool.space/api"
# Set to your Worker URL(s), e.g. https://cointrace-production.<account>.workers.dev
CORS_ORIGINS = "https://www.bitcoinbloodhound.com,https://bitcoinbloodhound.com"
RATE_LIMIT_MS = "8000"
JOBS_PER_TICK = "7"
TICK_BUDGET_MS = "50000"
RUNNING_JOB_STALE_MS = "120000"
MAX_GRAPH_VICTIMS = "10000"
MAX_GRAPH_DOWNSTREAM = "10000"

# Local wrangler dev: copy .dev.vars.example → .dev.vars
# Ops (add/remove hacker, clear-queue) use indexer CLI with --remote against D1 — no admin HTTP API.
