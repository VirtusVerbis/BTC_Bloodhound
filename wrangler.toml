# Cloudflare Workers + D1 + static assets (web UI)
name = "cointrace"
main = "packages/api/dist/worker.js"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "cointrace"
database_id = "72198afb-c475-4b32-a0fc-53fa34614a97"
migrations_dir = "migrations"

[triggers]
crons = ["*/1 * * * *"]

[vars]
# Local `pnpm cf:dev` / top-level config — no per-IP API rate limits.
ENVIRONMENT = "development"
ESPLORA_BASE = "https://blockstream.info/api"
MEMPOOL_BASE = "https://mempool.space/api"
# Set CORS_ORIGINS to your Worker URL(s), comma-separated (required for browser CORS).
CORS_ORIGINS = "http://localhost:8787,http://127.0.0.1:8787"
RATE_LIMIT_MS = "8000"
JOBS_PER_TICK = "3"
TICK_BUDGET_MS = "50000"
RUNNING_JOB_STALE_MS = "120000"
MAX_GRAPH_VICTIMS = "10000"
MAX_GRAPH_DOWNSTREAM = "10000"
GRAPH_PAGE_SIZE_DEFAULT = "500"
GRAPH_PAGE_SIZE_MAX = "1000"
GRAPH_CONTINUATION_RATE_LIMIT = "120"

# Production deploy: `pnpm cf:deploy` → wrangler deploy --env production
# Worker name: cointrace-production. Bindings (vars/D1/assets) are non-inheritable.
[env.production]
workers_dev = false

[env.production.assets]
directory = "apps/web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[env.production.d1_databases]]
binding = "DB"
database_name = "cointrace"
database_id = "72198afb-c475-4b32-a0fc-53fa34614a97"
migrations_dir = "migrations"

[env.production.triggers]
crons = ["*/1 * * * *"]

[env.production.vars]
ENVIRONMENT = "production"
ESPLORA_BASE = "https://blockstream.info/api"
MEMPOOL_BASE = "https://mempool.space/api"
# Set to your Worker URL(s), e.g. https://cointrace-production.<account>.workers.dev
CORS_ORIGINS = "https://www.bitcoinbloodhound.com,https://bitcoinbloodhound.com"
RATE_LIMIT_MS = "8000"
JOBS_PER_TICK = "1"
TICK_BUDGET_MS = "25000"
RUNNING_JOB_STALE_MS = "120000"
# Workers Free: 50 subrequests per cron invocation — chunk D1/sync work across ticks
SUBREQUEST_LIMIT_PER_INVOCATION = "50"
SCHEDULE_SUBREQUEST_RESERVE = "15"
SCHEDULE_RESERVE_MAINT_EXTRA = "10"
MAX_SUBREQUESTS_PER_JOB = "10"
MAX_EDGES_PER_JOB = "8"
MAX_GRAPH_EDGES_PER_TX = "200"
D1_BATCH_SIZE = "8"
SYNC_ADDRESSES_PER_JOB = "5"
CRAWL_ENQUEUE_PER_CRON = "1"
DOWNSTREAM_POLL_ENQUEUE_PER_CRON = "1"
HACKER_MAINTENANCE_EVERY_N_CRONS = "40"
BALANCE_REFRESH_INTERVAL_SEC = "900"
BTC_USD_PRICE_REFRESH_INTERVAL_SEC = "900"
DOWNSTREAM_POLL_INTERVAL_SEC = "1200"
MAX_GRAPH_VICTIMS = "10000"
MAX_GRAPH_DOWNSTREAM = "10000"
GRAPH_PAGE_SIZE_DEFAULT = "500"
GRAPH_PAGE_SIZE_MAX = "1000"
GRAPH_CONTINUATION_RATE_LIMIT = "120"
BACKFILL_TXS_PER_JOB = "1"
MAX_CHAIN_CALLS_PER_JOB = "1"
MAX_QUEUE_DEPTH = "360"

INDEXER_JOB_DETAILS = "1"
INDEXER_LOG_COLOR = "1"
JOB_RECLAIM_DEFER_AFTER = "1"
JOB_RECLAIM_DEFER_SEC = "300"
BACKFILL_SKIP_RECEIVES_PER_JOB = "25"

# Local wrangler dev: copy .dev.vars.example → .dev.vars
# Ops (add/remove hacker, clear-queue) use indexer CLI with --remote against D1 — no admin HTTP API.
