services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: node packages/api/dist/server.js
    ports:
      - "8787:8787"
    volumes:
      - ../data:/app/data
      - ../config:/app/config
    env_file:
      - ../config/settings.example.env
    environment:
      DATABASE_URL: file:/app/data/cointrace.db

  indexer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: node apps/indexer/dist/index.js run
    volumes:
      - ../data:/app/data
      - ../config:/app/config
    env_file:
      - ../config/settings.example.env
    environment:
      DATABASE_URL: file:/app/data/cointrace.db
    depends_on:
      - api

  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../apps/web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
